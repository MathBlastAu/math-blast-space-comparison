<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Blast · Phantom Labyrinth</title><style>body{margin:0;background:#0a1330;color:white;font:16px system-ui}main{max-width:1000px;margin:auto;padding:15px}h1{color:#70e9ee}button{background:#28477b;color:white;border:1px solid #75a7d1;border-radius:11px;padding:12px;cursor:pointer;font:inherit;touch-action:none}button:hover{background:#0c849e}canvas{width:100%;aspect-ratio:16/9;border:2px solid #6285b3;border-radius:12px;touch-action:none}nav,.controls,.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.hud{background:#1d345c;padding:13px;border-radius:10px}.overlay{position:fixed;inset:0;background:#07102aeb;display:flex;align-items:center;justify-content:center;padding:12px}.modal{max-width:510px;background:#1d335d;border:2px solid #7be9ed;border-radius:16px;padding:24px;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{min-height:56px}.muted{color:#bdcfe9;font-size:13px}</style><main><h1>🗝️ Math Blast: Phantom Labyrinth</h1><p class="muted">Space Arc · Year 4 · Top-down Zelda-style puzzle adventure</p><nav><button onclick="location.href='platformer.html'">🚀 Play platformer</button><button onclick="reset()">↻ Restart</button><button onclick="showHelp()">? Help</button></nav><canvas id="c" width="960" height="540"></canvas><div class="hud"><b id="zone"></b><b id="score"></b><span id="hint"></span></div><div class="controls"><span><button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button></span><span><button data-k="use">✦ USE</button></span></div><p class="muted">Move with WASD / arrow keys, E to interact. On tablet use touch controls. Find the glowing terminal, solve the fraction puzzle, then open the right-hand door. Avoid roaming security drones. Works offline.</p></main><div class="overlay" id="overlay"><div class="modal"><h2 id="title"></h2><p id="question"></p><p id="feedback" style="color:#ffe3a1"></p><div class="choices" id="choices"></div></div></div><script>
const $=id=>document.getElementById(id),g=$('c').getContext('2d');let x=110,y=270,room=0,done=[false,false,false,false],score=0,hp=3,keys={},paused=true,t=0,inv=0,boss=3;const qs=[['Star Map','Three of four navigation lights are on. What fraction is on?',['1/4','2/4','3/4','4/4'],2],['Reactor Relay','One quarter plus two quarters equals?',['2/8','3/4','1/2','4/4'],1],['Security Lock','Which is equal to one half?',['1/4','2/3','2/4','3/4'],2],['Phantom Seal','You have one half of the power, but need three quarters. How much more?',['1/4','1/2','2/4','3/4'],0]];function box(a,b,w,h,col){g.fillStyle=col;g.fillRect(a,b,w,h)}function circ(a,b,r,col){g.beginPath();g.arc(a,b,r,0,7);g.fillStyle=col;g.fill()}function text(s,a,b,z=20,col='white'){g.fillStyle=col;g.font=`bold ${z}px system-ui`;g.fillText(s,a,b)}function show(title,q,choices){paused=true;$('overlay').style.display='flex';$('title').textContent=title;$('question').textContent=q;$('feedback').textContent='';$('choices').innerHTML='';choices.forEach(([s,fn])=>{let b=document.createElement('button');b.textContent=s;b.onclick=fn;$('choices').append(b)})}function close(){paused=false;$('overlay').style.display='none'}function reset(){x=110;y=270;room=0;done=[false,false,false,false];score=0;hp=3;boss=3;show('🗝️ The Phantom Labyrinth','The Fraction Phantom has locked four chambers of Kepler Station. Explore each room, dodge security drones, repair its power terminal and unlock the next door.',[['Begin adventure',close]])}function showHelp(){show('How to play','Explore using arrows or WASD. Press E or USE near the glowing terminal. After solving its puzzle, go to the door at the right side and press E. Avoid the pink patrol drones.',[['Continue',close]])}function quiz(){let q=qs[room];show('⚡ '+q[0],q[1],q[2].map((s,i)=>[s,()=>{if(i===q[3]){done[room]=true;score+=150;close();$('hint').textContent='Door unlocked! Go to the right exit.'}else{$('feedback').textContent='Try again. Imagine four equal pieces.';score=Math.max(0,score-10)}}]))}function bossFight(){show('👻 Fraction Phantom','Three quarters of eight shield crystals must be disabled. How many crystals is that?', [['4',wrong],['5',wrong],['6',()=>{boss--;score+=100;close();if(boss===0)win()}],['7',wrong]])}function wrong(){$('feedback').textContent='Hint: One quarter of eight is two.'}function win(){show('🏆 Station saved!',`You defeated the Phantom and earned ${score} stars. Now compare with the platformer!`,[['Play again',reset],['Try platformer',()=>location.href='platformer.html']]);try{localStorage.setItem('mathblast-adventure-complete','yes')}catch(e){}}function use(){if(paused)return;if(Math.hypot(x-470,y-270)<105&&!done[room])return quiz();if(x>795&&y>175&&y<355){if(!done[room]){$('hint').textContent='Locked! Solve the glowing terminal first.';return}if(room===3)return bossFight();room++;x=110;y=270;$('hint').textContent='Find the glowing terminal.';return}$('hint').textContent='Move closer to a console or the right-hand door.'}function draw(){box(0,0,960,540,'#09142f');for(let i=0;i<60;i++)circ(i*191%960,i*79%540,1,'#b8e8ff');box(45,65,870,410,'#314a77');box(65,85,830,370,'#172c50');for(let i=0;i<10;i++)for(let j=0;j<5;j++)box(80+i*80,90+j*72,74,65,(i+j)%2?'#20365d':'#1b3055');box(875,205,22,135,done[room]?'#3ce3ae':'#f17b9d');text(done[room]?'EXIT →':'LOCKED',774,196,19);box(435,225,70,90,done[room]?'#29a992':'#b88455');box(445,236,50,40,done[room]?'#6af4d4':'#69dcf4');text(done[room]?'✓':'?',458,268,30,'#11213d');text('POWER TERMINAL',392,213,15,'#ffe29b');for(let i=0;i<3;i++){let a=250+i*210,b=270+Math.sin(t*.025+i+room)*115;circ(a,b,20,'#e46d9c');circ(a-6,b-5,4,'white');circ(a+6,b-5,4,'white')}for(let i=0;i<5;i++)circ(145+i*170,130+(i%2)*270,7,'#ffe189');if(inv<=0||Math.floor(t/5)%2){circ(x,y-22,19,'#efc89c');box(x-20,y-2,40,37,'#60c7e9');box(x-23,y-47,46,8,'#ffe19a');text('J',x-7,y+24,20)}if(room===3){circ(760,400,28,'#a66bea');text('👻',740,415,39);text('PHANTOM '+boss+'/3',660,455,17)}text(['ARRIVAL HALL','REACTOR CHAMBER','SECURITY VAULT','PHANTOM SANCTUM'][room],30,40,25,'#76edf1')}function loop(){t++;if(!paused){let ox=x,oy=y;x+=((keys.right?1:0)-(keys.left?1:0))*3.5;y+=((keys.down?1:0)-(keys.up?1:0))*3.5;x=Math.max(98,Math.min(852,x));y=Math.max(112,Math.min(421,y));if(!done[room]&&Math.hypot(x-470,y-270)<55){x=ox;y=oy}for(let i=0;i<3;i++){let a=250+i*210,b=270+Math.sin(t*.025+i+room)*115;if(Math.hypot(x-a,y-b)<35&&inv<=0){hp--;inv=85;$('hint').textContent='Drone hit! Avoid the patrol route.';if(hp<=0){hp=3;x=110;y=270}}}inv--;if(x>840&&!done[room])x=840}$('zone').textContent='CHAMBER '+(room+1)+'/4';$('score').textContent='⭐ '+score+' · ❤️ '+hp+' · 🔓 '+done.filter(Boolean).length+'/4';draw();requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),v=({arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'})[k];if(v){keys[v]=true;e.preventDefault()}if(k==='e'||k==='enter')use()});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase(),v=({arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'})[k];if(v)keys[v]=false});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(k==='use')use();else keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});reset();requestAnimationFrame(loop);
</script></html>
