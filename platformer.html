<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Blast Arcade</title><style>body{background:#0b1430;color:white;font:16px system-ui;margin:0}main{max-width:950px;margin:auto;padding:16px}h1{color:#66e7e8}nav{display:flex;flex-wrap:wrap;gap:7px}button{padding:12px;background:#294475;color:white;border:1px solid #668abf;border-radius:10px;cursor:pointer}button.active{background:#008b9e}canvas{width:100%;aspect-ratio:16/9;border:2px solid #5779a8;margin-top:12px;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px;background:#1d3156;margin:10px 0;border-radius:9px}.controls{display:flex;justify-content:space-between}.controls button{min-width:65px;touch-action:none}.overlay{display:none;position:fixed;inset:0;background:#050a20e8;align-items:center;justify-content:center;padding:15px}.modal{background:#233762;border:2px solid #69e5ed;border-radius:14px;padding:25px;max-width:450px;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{min-height:55px}.muted{color:#b6c7e4;font-size:13px}</style><main><h1>🚀 Math Blast Arcade</h1><p class="muted">Space Arc · Year 4 · Platformer prototype · no account needed</p><nav id="nav"></nav><canvas id="canvas" width="960" height="540"></canvas><div class="bar"><b id="status"></b><b id="score"></b></div><div class="bar"><span id="hint"></span><span><button id="reset">Restart</button><button id="help">Help</button></span></div><div class="controls"><span><button data-k="left">◀</button><button data-k="right">▶</button></span><span><button data-k="use">USE</button><button data-k="jump">JUMP / UP</button></span></div><p class="muted">A/D or arrows: move · Space: jump or swim up · E: use console. Original placeholder graphics; works offline.</p></main><div id="overlay" class="overlay"><div class="modal"><h2 id="title"></h2><p id="question"></p><div id="choices" class="choices"> [['Sword','7 × 6?',['36','40','42','48'],2],['Shield','48 ÷ 6?',['6','7','8','9'],2],['Cannon','9 × ? = 63',['6','7','8','9'],1]]];let mode=0,done=[],px=60,py=360,vy=0,cam=0,stars=0,hp=3,paused=false,finished=false,keys={},mines=[];const len=[5400,3100,3000,3100,1200];function box(a,b,w,h,col){g.fillStyle=col;g.fillRect(a,b,w,h)}function text(s,a,b,z=20,col='white'){g.fillStyle=col;g.font=`bold ${z}px system-ui`;g.fillText(s,a,b)}function circle(a,b,r,col){g.beginPath();g.arc(a,b,r,0,7);g.fillStyle=col;g.fill()}function hud(msg){$('status').textContent=names[mode];$('score').textContent=`⭐ ${stars} ❤️ ${hp} 🧩 ${done.filter(Boolean).length}/${done.length}`;if(msg)$('hint').textContent=msg}function show(title,question,opts){paused=true;$('overlay').style.display='flex';$('title').textContent=title;$('question').textContent=question;$('choices').innerHTML='';opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('choices').append(b)})}function close(){paused=false;$('overlay').style.display='none'}function start(i){mode=i;done=Array(data[i].length).fill(false);px=60;py=360;vy=0;cam=0;stars=0;hp=3;mines=[];keys={};finished=false;close();[...$('nav').children].forEach((b,j)=>b.classList.toggle('active',i===j));hud(['Repair five consoles and confront the Phantom.','Explore and unlock division gates.','Swim, dodge mines and repair oxygen stations.','Build through three geometry puzzles.','Battle Captain Crooke with maths.'][i])}function quiz(i){if(paused||done[i])return;let q=data[mode][i];show('🧠 '+q[0],q[1],q[2].map((a,j)=>[a,()=>{if(j===q[3]){done[i]=true;stars+=30;close();hud('Correct! Route unlocked.');if(done.every(Boolean))win()}else{$('question').textContent='Try again! '+q[1];hp=Math.max(1,hp-1);hud()}}]))}function win(){finished=true;stars+=100;hud('Mission complete!');show('🏆 You did it!',`You earned ${stars} stars. Try a different game style!`,[['Replay',()=>start(mode)],['Choose another',close]])}function interact y-py)<35){hp--;m.x=-999;if(hp<=0){hp=3;px=Math.max(60,px-300)}hud('Mine hit — watch your oxygen!')}});mines=mines.filter(m=>m.x>px-550)}else{if(keys.jump&&py>=360)vy=-12;vy+=.55;py=Math.min(360,py+vy);if(py===360)vy=0}let step=len[mode]/(done.length+1);done.forEach((v,i)=>{if(!v&&px>(i+1)*step+140)px=(i+1)*step+140});if(done.every(Boolean)&&!finished)win()}cam=Math.max(0,Math.min(len[mode]-960,px-310));draw();requestAnimationFrame(loop)}$('nav').innerHTML='<button>🚀 Space platformer</button><button onclick="location.href=\'adventure.html\'">🗝️ Play Zelda-style adventure</button>'; [...$('nav').children].forEach((b,i)=>b.onclick=()=>start(i));$('reset').onclick=()=>start(mode);$('help').onclick=()=>show('How to play','Move with arrows or A/D, jump with Space, interact using E. Ocean: hold jump to swim up and dodge mines. Solve each challenge to open the next area.',[['Play',close]]);function key(k){return ['ArrowLeft','a','A'].includes(k)?'left':['ArrowRight','d','D'].includes(k)?'right':[' ','ArrowUp','w','W'].includes(k)?'jump':['e','E','Enter'].includes(k)?'use':k}window.addEventListener('keydown',e=>{let k=key(e.key);if(['left','right','jump','use'].includes(k))e.preventDefault();if(k==='use'&&!keys.use)interact();keys[k]=true});window.addEventListener('keyup',e=>keys[key(e.key)]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='use')interact();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});start(0);requestAnimationFrame(loop);
